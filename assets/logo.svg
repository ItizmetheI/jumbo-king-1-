<!--
  Jumbo King Burger — brand lockup, redrawn as vector to match the supplied
  logo artwork. Wordmark is set in Anton, which is close to but not identical
  to the cut used in the original; if you have the designer's vector file,
  it will beat this. Colours are a best-effort match from the reference
  photos — for pixel-exact hex, share the source art file or a clean photo.

  Grouped and id'd (#badge/#wordmark/#burger/#banner) so assets/motion.js can
  animate each piece independently instead of the whole file as one image.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 372" role="img" aria-labelledby="jkb-logo-title jkb-logo-desc">
  <title id="jkb-logo-title">Jumbo King Burger</title>
  <desc id="jkb-logo-desc">A bread-slice badge with the Jumbo King Burger wordmark, a burger icon, and a red banner reading "the one, the only".</desc>

  <g id="badge">
    <path d="M55 310L245 310Q265 310 265 290L265 150C265 75 225 20 150 20C75 20 35 75 35 150L35 290Q35 310 55 310Z"
          transform="translate(9 9)" fill="#7A3D0E" opacity=".55"/>
    <path d="M55 310L245 310Q265 310 265 290L265 150C265 75 225 20 150 20C75 20 35 75 35 150L35 290Q35 310 55 310Z"
          fill="#FFFFFF" stroke="#F2660D" stroke-width="9" stroke-linejoin="round"/>
  </g>

  <g id="wordmark" font-family="Anton, Impact, 'Arial Narrow Bold', sans-serif" text-anchor="middle">
    <g fill="#F2660D">
      <text x="153" y="105" font-size="49">JUMBO</text>
      <text x="153" y="152" font-size="45">KING</text>
      <text x="153" y="203" font-size="52">BURGER</text>
    </g>
    <g fill="#101010">
      <text x="150" y="102" font-size="49">JUMBO</text>
      <text x="150" y="149" font-size="45">KING</text>
      <text x="150" y="200" font-size="52">BURGER</text>
    </g>
  </g>

  <g id="burger">
    <path d="M78 246c0-21 32-36 72-36s72 15 72 36z" fill="#F2A93B"/>
    <g fill="#FFF3D6">
      <circle cx="112" cy="232" r="3.4"/><circle cx="134" cy="223" r="3.4"/>
      <circle cx="158" cy="221" r="3.4"/><circle cx="182" cy="228" r="3.4"/>
      <circle cx="124" cy="243" r="3"/><circle cx="196" cy="240" r="3"/><circle cx="150" cy="238" r="3"/>
    </g>
    <rect x="76" y="250" width="148" height="11" rx="5.5" fill="#DA1E28"/>
    <rect x="78" y="264" width="144" height="11" rx="5.5" fill="#4CAF3E"/>
    <path d="M92 278h116l-42 22c-9 5-20 5-29 0z" fill="#F2A93B"/>
    <rect x="76" y="277" width="148" height="13" rx="6.5" fill="#4A2E1D"/>
    <rect x="76" y="294" width="148" height="13" rx="6.5" fill="#4A2E1D"/>
    <path d="M82 311h136c0 12-24 19-68 19s-68-7-68-19z" fill="#F2A93B"/>
  </g>

  <g id="banner">
    <rect x="66" y="336" width="168" height="30" rx="8" fill="#DA1E28"/>
    <text x="150" y="357" font-family="Anton, Impact, sans-serif" font-size="18"
          fill="#FFFFFF" text-anchor="middle" letter-spacing=".5">THE ONE. THE ONLY.</text>
  </g>
</svg>
