name = "jumbo-king-1"
main = "worker/index.js"
compatibility_date = "2025-01-01"

# Lets Worker Logs actually show request/error output in the dashboard.
# A dashboard-only toggle here gets reset by the next deploy from GitHub —
# this needs to live in the committed config to stick.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

# Static site is served from the repo root; .assetsignore keeps source and
# tooling out of the deployed bundle.
[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"

# Enquiries + rate-limit counters. Create with:
#   wrangler kv namespace create ENQUIRIES
# then paste the id below. The Worker fails open without it: no rate limiting
# and no stored copy, but the endpoint still validates and still emails.
# [[kv_namespaces]]
# binding = "ENQUIRIES"
# id = "<paste-id-here>"

[vars]
# Where contact / franchise enquiries land. The API key stays a secret, set via:
#   wrangler secret put RESEND_API_KEY
ENQUIRY_TO   = "Jethwafoods@aol.com"
# ENQUIRY_FROM = "Jumbo King Burger <hello@yourdomain.com>"
