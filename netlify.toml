# Netlify is the production host. Cloudflare (worker/, wrangler.toml) is the
# demo deploy and is not the target — see PLAN.md.
[build]
  publish = "."
  command = ""

# Netlify serves /menu from menu.html automatically, so links stay extensionless.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Inline scripts are hashed, not nonce'd, so the site stays fully static.
    # style-src keeps 'unsafe-inline' for style="" attributes — a far smaller
    # surface than inline script.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-snn76VxYj4st78Oq1MEE8S9HRmQStQCwWJXzAw158Mk=' 'sha256-Du+OJKJSbdUgz5nrHeWWINvez6XKDDU/tyj/5c2uvwo='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Keep dev-only files out of the deploy
[[redirects]]
  from = "/serve.py"
  to = "/404.html"
  status = 404
[[redirects]]
  from = "/PLAN.md"
  to = "/404.html"
  status = 404
